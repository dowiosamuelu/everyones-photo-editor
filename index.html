<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0e0e0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>底片機 Film Cam</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0e0e0e; --panel: #1a1a1a; --line: #2c2c2c; --fg: #f2efe9; --dim: #9a958c;
    --accent: #ff6a2b; --mono: ui-monospace, "SFMono-Regular", "Roboto Mono", "Droid Sans Mono", Menlo, "Courier New", monospace;
    --base: #151311; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; height: 100dvh; padding-top: var(--safe-t); padding-bottom: var(--safe-b); user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  header { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; flex: none; }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: .08em; margin: 0; }
  .icon-btn { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; }
  .icon-btn:active { background: #ffffff18; }
  .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #viewfinder { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; overflow: hidden; }
  #stage { position: relative; }
  #preview { display: block; width: 100%; height: 100%; background: #000; border-radius: 4px; }
  #stamp { position: absolute; right: 5%; bottom: 4.5%; font-family: "Courier New", ui-monospace, monospace; font-weight: 700;
    color: #ff9a3c; text-shadow: 0 0 4px #ff6a00cc, 0 0 10px #ff5a0088; letter-spacing: .12em; display: none; pointer-events: none; }
  #hint { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--dim); font-size: 14px; line-height: 1.7; }
  #hint b { color: var(--fg); font-weight: 600; }
  #hint .row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .pill { padding: 10px 18px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; color: var(--fg); }
  .pill.primary { background: var(--accent); border-color: var(--accent); color: #1a0d00; font-weight: 600; }
  #sceneBar { flex: none; margin: 4px auto 6px; max-width: calc(100% - 28px); display: flex; align-items: center; gap: 8px;
    padding: 7px 14px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; color: var(--dim);
    white-space: nowrap; overflow: hidden; }
  #sceneBar b { color: var(--fg); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  #sceneBar.set { border-color: #ff6a2b66; }
  #scenePanel { flex: none; display: none; flex-direction: column; background: var(--panel); border-radius: 16px 16px 0 0;
    max-height: 64dvh; border-top: 1px solid var(--line); }
  #scenePanel.open { display: flex; }
  #scenePanel .scroll { overflow-y: auto; padding: 12px 16px 4px; }
  .sgroup { margin-bottom: 10px; }
  .sgroup h3 { font-size: 13px; font-weight: 600; margin: 0 0 7px; color: var(--fg); }
  .sgroup h3 small { font-weight: 400; color: var(--dim); margin-left: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 6px 11px; border-radius: 15px; border: 1px solid var(--line); background: #222; font-size: 13px; color: var(--fg); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #1a0d00; font-weight: 600; }
  .shint { font-size: 12px; color: var(--dim); margin-top: 5px; }
  .rec { border-top: 1px solid var(--line); padding: 10px 16px calc(10px + var(--safe-b)); }
  .rec .why { font-size: 12px; color: var(--dim); line-height: 1.45; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .scrollWrap { position: relative; min-height: 0; flex: 1 1 auto; display: flex; flex-direction: column; }
  #scenePanel .scroll { flex: 1 1 auto; min-height: 0; }
  .more { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 0 6px; text-align: center; font-size: 12px; color: var(--fg);
    background: linear-gradient(transparent, var(--panel) 60%); pointer-events: none; display: none; }
  .rec .row { display: flex; gap: 8px; align-items: center; }
  .recLooks { display: flex; gap: 8px; flex: 1; overflow-x: auto; scrollbar-width: none; }
  .recLook { flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 10px; border: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  .recLook i { width: 28px; height: 28px; border-radius: 6px; background-size: cover; display: block; }
  .recLook.on { border-color: var(--accent); color: var(--fg); }
  .recLook em { font-style: normal; font-size: 10px; color: var(--accent); display: block; }
  .rec .tweak { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); margin-top: 8px; }
  .rec .tweak input { accent-color: var(--accent); }
  .rec .acts { display: flex; gap: 8px; margin-top: 10px; }
  .rec .acts .pill { flex: 1; padding: 9px; }
  body.scene-open #folders, body.scene-open #looks, body.scene-open #controls, body.scene-open #sceneBar { display: none; }
  body.settings-open #folders, body.settings-open #looks, body.settings-open #controls, body.settings-open #sceneBar { display: none; }
  .inpanel { flex: none; display: none; flex-direction: column; background: var(--panel); border-radius: 16px 16px 0 0; max-height: 52dvh; border-top: 1px solid var(--line); }
  .inpanel.open { display: flex; }
  .inpanel .body { overflow-y: auto; padding: 12px 18px calc(16px + var(--safe-b)); }
  .inpanel h2 { font-size: 15px; margin: 2px 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .inpanel h4 { font-size: 13px; margin: 14px 0 8px; color: var(--fg); }
  .inpanel h4 small { font-weight: 400; color: var(--dim); margin-left: 6px; font-size: 11px; }
  .inpanel .field { margin: 0 0 12px; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; border-radius: 4px; }
  .look .sw { position: relative; }
  .look .badge { position: absolute; top: 3px; right: 3px; font-size: 9px; background: var(--accent); color: #1a0d00; border-radius: 6px; padding: 1px 4px; font-weight: 700; font-style: normal; }
  #looks { flex: none; display: flex; gap: 10px; overflow-x: auto; padding: 6px 14px 10px; scrollbar-width: none; scroll-snap-type: x proximity; }
  #looks::-webkit-scrollbar { display: none; }
  .look { flex: none; width: 64px; text-align: center; font-size: 11px; color: var(--dim); scroll-snap-align: center; }
  .look .sw { width: 64px; height: 64px; border-radius: 10px; border: 2px solid transparent; display: block; margin-bottom: 5px; background-size: cover; background-position: center; }
  .look.on { color: var(--fg); }
  .look.on .sw { border-color: var(--accent); }
  #controls { flex: none; height: 104px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 22px; }
  #thumb { width: 48px; height: 48px; border-radius: 8px; background: var(--panel) center/cover; border: 1px solid var(--line); justify-self: start; }
  #shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--fg); display: grid; place-items: center; }
  #shutter span { width: 60px; height: 60px; border-radius: 50%; background: var(--fg); transition: transform .08s; display: grid; place-items: center; color: #111; font-size: 13px; font-weight: 700; }
  #shutter:active span { transform: scale(.9); }
  #shutter.busy span { background: var(--dim); }
  #flip { justify-self: end; }
  .sheet { position: fixed; inset: 0; background: #000a; display: none; z-index: 20; }
  .sheet.open { display: flex; flex-direction: column; justify-content: flex-end; }
  .sheet .body { background: var(--panel); border-radius: 16px 16px 0 0; padding: 14px 18px calc(18px + var(--safe-b)); max-height: 85dvh; overflow-y: auto; }
  .sheet h2 { font-size: 15px; margin: 4px 0 14px; display: flex; justify-content: space-between; align-items: center; }
  .field { margin: 0 0 16px; }
  .field label { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  .field label output { color: var(--fg); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .toggle { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding: 6px 0 14px; }
  .toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
  .note { font-size: 12px; color: var(--dim); line-height: 1.6; }
  #viewer { position: fixed; inset: 0; background: #000; z-index: 30; display: none; flex-direction: column; padding-top: var(--safe-t); padding-bottom: var(--safe-b); }
  #viewer.open { display: flex; }
  #viewer .img-wrap { flex: 1; min-height: 0; display: grid; place-items: center; padding: 10px; }
  #viewer img { max-width: 100%; max-height: 100%; object-fit: contain; -webkit-touch-callout: default; user-select: auto; -webkit-user-select: auto; }
  #viewer .bar { display: flex; gap: 10px; justify-content: center; padding: 12px; flex-wrap: wrap; }
  #viewer .tip { text-align: center; font-size: 12px; color: var(--dim); padding: 0 16px 8px; }
  #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  #grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; }
  #toast { position: fixed; left: 50%; top: calc(56px + var(--safe-t)); transform: translateX(-50%); max-width: calc(100% - 24px); text-overflow: ellipsis; overflow: hidden; background: #000d; padding: 8px 14px; border-radius: 18px; font-size: 13px; z-index: 40; display: none; white-space: nowrap; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 15; }
  .hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  /* ---- v6：資料夾、手勢、調整面板 ---- */
  #viewfinder { touch-action: none; }
  #stage { transform-origin: 50% 50%; }
  .adjBtn { display: flex; align-items: center; gap: 5px; padding: 7px 12px 7px 9px; border-radius: 18px; font-size: 13px; position: relative; border: 1px solid var(--line); }
  .adjBtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
  .adjBtn.mod { border-color: #ff6a2b88; }
  #folders { flex: none; display: flex; gap: 2px; overflow-x: auto; padding: 0 44px 0 10px; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to right, #000 88%, transparent); mask-image: linear-gradient(to right, #000 88%, transparent); }
  #folders::-webkit-scrollbar { display: none; }
  .folder { flex: none; padding: 6px 11px; font-size: 13px; color: var(--dim); border-radius: 14px; white-space: nowrap; }
  .folder.on { color: var(--fg); background: #ffffff16; font-weight: 600; }
  .folder small { font-size: 10px; margin-left: 3px; color: var(--accent); }
  #looks { padding: 6px 14px 6px; min-height: 90px; touch-action: pan-x; }
  .look { width: 60px; }
  .look .sw { width: 60px; height: 60px; margin-bottom: 4px; }
  .look .nm { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .look .star { position: absolute; left: 4px; top: 1px; font-size: 12px; color: #ffd36a; font-style: normal; text-shadow: 0 0 3px #000; }
  .look .tag { position: absolute; left: 3px; bottom: 3px; font-size: 9px; background: #000b; color: #fff; border-radius: 5px; padding: 1px 4px; font-style: normal; }
  #looks .empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--dim); font-size: 13px; line-height: 1.6; min-height: 76px; }
  #controls { height: 96px; }
  #lookToast { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -6px); background: #000a; padding: 7px 16px; border-radius: 14px; text-align: center;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap; }
  #lookToast.show { opacity: 1; transform: translate(-50%, 0); }
  #lookToast b { display: block; font-size: 16px; font-weight: 600; letter-spacing: .06em; }
  #lookToast small { font-size: 11px; color: #d8d2c6; }
  #compareTag { position: absolute; top: 16px; left: 16px; background: #000b; padding: 4px 10px; border-radius: 10px; font-size: 12px; display: none; pointer-events: none; }
  body.compare #compareTag { display: block; }
  body.compare #fx, body.compare #stamp { visibility: hidden; }
  #zoomTag { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 22px; font-weight: 600; background: #0008; padding: 6px 14px;
    border-radius: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; font-variant-numeric: tabular-nums; }
  #zoomTag.show { opacity: 1; }
  #strengthPop { position: absolute; left: 14px; right: 14px; bottom: 12px; display: none; align-items: center; gap: 10px; background: #000c; padding: 8px 14px; border-radius: 22px; font-size: 13px; }
  #strengthPop.show { display: flex; }
  #strengthPop input { flex: 1; }
  #strengthPop output { width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
  #zoomChips { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: none; gap: 4px; background: #0006; padding: 3px; border-radius: 20px; }
  body.cam #zoomChips { display: flex; }
  #strengthPop.show ~ #zoomChips { display: none; }
  .zchip { min-width: 34px; height: 34px; padding: 0 6px; border-radius: 17px; font-size: 11px; color: #fff; background: #0005; font-variant-numeric: tabular-nums; }
  .zchip.on { color: #ffcf5a; font-size: 12px; font-weight: 700; }
  /* 調整面板：一次一個大滑桿 */
  #settingsSheet { max-height: none; padding-top: 8px; }
  .adjTop { display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 36px; }
  #adjValBtn { display: flex; align-items: baseline; gap: 8px; font-size: 15px; padding: 4px 2px; }
  #adjValBtn b { font-weight: 600; }
  #adjValBtn output { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 14px; }
  #adjValBtn i { font-style: normal; font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px; display: none; }
  #adjValBtn.mod i { display: inline-block; }
  .adjTop .sp { flex: 1; }
  .mini { font-size: 12px; padding: 6px 10px; border-radius: 14px; border: 1px solid var(--line); color: var(--fg); white-space: nowrap; position: relative; }
  .mini.acc { border-color: #ff6a2b88; color: var(--accent); }
  .sliderWrap { position: relative; padding: 4px 14px 0; }
  #adjSlider { width: 100%; height: 30px; margin: 0; }
  #adjTick { position: absolute; top: 0; width: 2px; height: 7px; background: var(--dim); border-radius: 1px; pointer-events: none; }
  .adjHint { font-size: 12px; color: var(--dim); padding: 0 16px; min-height: 17px; line-height: 1.4; }
  #toolRow { display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px 10px; scrollbar-width: none; }
  #toolRow::-webkit-scrollbar { display: none; }
  .tool { flex: 1 0 auto; min-width: 66px; padding: 7px 8px; border-radius: 12px; background: #232323; border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
  .tool b { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .tool small { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tool.on { border-color: var(--accent); }
  .tool.on b { color: var(--accent); }
  .tool.on2 { background: #ff6a2b22; border-color: #ff6a2b88; }
  .tool.mod::after, .gtab.mod::after, .adjBtn.mod::after, .mini.mod::after { content: ''; position: absolute; top: 4px; right: 5px; width: 6px; height: 6px; border-radius: 3px; background: var(--accent); }
  .adjBar { display: flex; align-items: center; border-top: 1px solid var(--line); height: 54px; }
  .adjBar > button { width: 58px; height: 54px; display: grid; place-items: center; flex: none; }
  .adjBar svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #adjDone { color: var(--accent); }
  #groupTabs { flex: 1; display: flex; justify-content: space-around; overflow-x: auto; scrollbar-width: none; }
  .gtab { padding: 10px 6px; font-size: 14px; color: var(--dim); position: relative; white-space: nowrap; }
  .gtab.on { color: var(--fg); font-weight: 600; }
  .gtab.on::before { content: ''; position: absolute; left: 25%; right: 25%; bottom: 3px; height: 2px; background: var(--fg); border-radius: 1px; }
  .gtab.mod::after { top: 7px; right: 0; }
  .sheet .acts { display: flex; gap: 8px; margin-top: 14px; }
  .sheet .acts .pill { flex: 1; padding: 11px 8px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .stack .pill { padding: 12px; }
  .pill.danger { color: #ff7a66; border-color: #ff7a6655; }
  .textIn { width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: #111; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
    user-select: text; -webkit-user-select: text; }
  .textIn:focus { outline: none; border-color: var(--accent); }
  /* ---- v7：底片印刷品語彙（片號、齒孔、等寬數字、片盒標籤） ---- */
  header h1 { font-family: var(--mono); font-size: 14px; letter-spacing: .18em; display: flex; align-items: center; gap: 8px; }
  #counter { font-size: 12px; letter-spacing: .06em; color: var(--accent); border: 1px solid #ff6a2b77; border-radius: 4px; padding: 1px 5px 0; line-height: 16px; background: #0006; }
  #sceneBar { border-radius: 6px; }
  #sceneBar b { letter-spacing: .02em; }
  .folder { border-radius: 3px; letter-spacing: .06em; padding: 6px 10px; }
  .folder.on { background: none; color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); border-radius: 0; }
  .folder small { font-family: var(--mono); }
  /* 風格列＝一條底片：上下齒孔、片號印在邊上 */
  #looks { gap: 8px; padding: 13px 12px 13px; min-height: 0; background-color: var(--base); background-attachment: local;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 5px, #3b3632 5px 11px, transparent 11px 16px),
      repeating-linear-gradient(90deg, transparent 0 5px, #3b3632 5px 11px, transparent 11px 16px);
    background-size: 100% 5px, 100% 5px; background-position: 0 4px, 0 calc(100% - 4px); background-repeat: repeat-x; }
  .look { width: 58px; font-size: 11px; }
  .look .no { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .08em; color: #ff6a2bb0; text-align: left; height: 12px; line-height: 12px; }
  .look.on .no { color: var(--accent); }
  .look .sw { width: 58px; height: 58px; border-radius: 2px; margin-bottom: 4px; }
  .look .nm { letter-spacing: .03em; }
  #looks .empty { min-height: 88px; }
  #lookToast { border-radius: 4px; padding: 8px 16px 7px; border: 1px solid #ffffff22; }
  #lookToast small { font-family: var(--mono); letter-spacing: .04em; font-size: 10px; }
  #lookToast i { font-style: normal; color: var(--accent); }
  #compareTag { font-family: var(--mono); letter-spacing: .1em; border-radius: 3px; }
  #zoomTag, .zchip, #strengthPop output, #adjValBtn output, .tool small, #quickStrengthVal { font-family: var(--mono); }
  #zoomTag { border-radius: 4px; }
  .tool { border-radius: 6px; }
  .tool small { font-size: 10.5px; }
  .mini, .pill, .chip, .recLook { border-radius: 6px; }
  #strengthPop { border-radius: 8px; }
  #strengthPop span { letter-spacing: .08em; }
  #adjValBtn b { letter-spacing: .06em; }
  .gtab { letter-spacing: .08em; }
  .look .tag { font-family: var(--mono); border-radius: 2px; }
  .look .badge { border-radius: 2px; }
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="importBtn" title="匯入照片" aria-label="匯入照片">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
  </button>
  <h1>FILM CAM<span id="counter" aria-label="這次拍了幾張">00</span></h1>
  <button class="adjBtn" id="settingsBtn" aria-label="調整">
    <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>調整
  </button>
</header>

<div id="viewfinder">
  <div id="stage">
    <canvas id="preview"></canvas>
    <canvas id="fx"></canvas>
    <div id="stamp"></div>
  </div>
  <div id="lookToast"></div>
  <div id="compareTag">原圖</div>
  <div id="zoomTag"></div>
  <div id="strengthPop"><span>強度</span><input type="range" id="quickStrength" min="0" max="100" step="1" aria-label="濾鏡強度"><output id="quickStrengthVal"></output></div>
  <div id="zoomChips"></div>
  <div id="hint"></div>
</div>

/* ---------------------------------------------------------------
   場景選單：使用者勾選 → 推薦風格（score）＋ 場景微調（tweak）
   tweak 的 key：一般參數名，或「色相區段.h/s/l」

const SCENE_GROUPS = [
  { key: 'subject', title: '主要拍什麼', note: '單選', single: true, help: '人像＝臉是重點（寵物也選這個）；人＋景＝旅遊打卡，風景才是重點', options: [

      score: { gold: 1, classicchrome: 1, superia: 1, vivid: 1, night: -3 }, why: '' },

      score: { classicchrome: 3, mono: 2, classicneg: 1, gold: -1, night: -2 },

const TIE = { portra: 0.3, classicchrome: 0.2, gold: 0.1 };
const CLAMP = { exposure: 0.4, temp: 0.25, contrast: 0.15, fade: 0.06, chrome: 0.4, h: 0.03, s: 0.25, l: 0.15 };

function sceneSelected(scene) {
  return [scene.subject, scene.light, ...(scene.things || [])].filter(Boolean).map(id => SCENE_OPT[id]).filter(Boolean);
}
function recommend(scene) {
  const sel = sceneSelected(scene);
  if (!sel.length) return { looks: [], tweak: {}, why: [] };
  const score = {};
  LOOKS.forEach(l => score[l.id] = TIE[l.id] || 0);
  sel.forEach(o => Object.entries(o.score || {}).forEach(([k, v]) => score[k] += v));
  // 規則：有人像＋黃昏 → 再壓一點橘色（直射夕陽會讓膚色太橘）
  const tweak = {};
  const add = (k, v) => tweak[k] = (tweak[k] || 0) + v;
  sel.forEach(o => Object.entries(o.tweak || {}).forEach(([k, v]) => {
    // 室內或夜晚時，不採用葉子的「加暖」
    if (k === 'temp' && o.group === 'things' && (scene.light === 'indoor' || scene.light === 'night')) return;
    add(k, v);
  }));
  if ((scene.subject === 'person' || scene.subject === 'both') && scene.light === 'golden') add('orange.s', -0.1);
  Object.keys(tweak).forEach(k => {
    const lim = CLAMP[k] != null ? CLAMP[k] : CLAMP[k.split('.')[1]];
    if (lim != null) tweak[k] = Math.max(-lim, Math.min(lim, tweak[k]));
  });
  const looks = Object.entries(score).sort((a, b) => b[1] - a[1]).filter(([, s]) => s > 0.5).slice(0, 3).map(([id]) => id);
  const why = sel.map(o => o.why).filter(Boolean);
  return { looks, tweak, why };
}
function applyTweak(p, tweak) {
  for (const [k, v] of Object.entries(tweak)) {
    if (k.includes('.')) {
      const [band, ch] = k.split('.');
      const i = { h: 0, s: 1, l: 2 }[ch];
      p.hsl[band] = p.hsl[band].slice(); p.hsl[band][i] += v;
    } else p[k] = (p[k] || 0) + v;
  }
  return p;
}

const USER_DEFAULT = { strength: 100, exposure: 0, temp: 0, tint: 0, grain: 100, halation: 100, vignette: 0,

uniform float uSeed, uExposure, uSat, uFade, uWhite, uCrush, uContrast, uShoulder;
uniform vec3 uWB, uShadowTint, uHighTint, uChan;
uniform vec3 uHSL[8];
const float HC[9] = float[9](0.0, 30./360., 58./360., 120./360., 180./360., 220./360., 275./360., 320./360., 1.0);
uniform float uChrome, uGrain, uGrainCell, uHalation, uBloom, uVignette, uMono, uSoft, uStrength;
uniform float uClarity, uEdge, uLeak, uLeakA, uLeakP, uFxSeed;
uniform float uLodHal, uLodSoft, uLodMid, uFlipX, uZoom;

vec3 toLin(vec3 c){ return pow(max(c,0.0), vec3(2.2)); }
vec3 toGam(vec3 c){ return pow(max(c,0.0), vec3(1.0/2.2)); }
float luma(vec3 c){ return dot(c, vec3(.299, .587, .114)); }
vec3 rgb2hsv(vec3 c){
  vec4 K = vec4(0., -1./3., 2./3., -1.);
  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
  float d = q.x - min(q.w, q.y); float e = 1e-10;
  return vec3(abs(q.z + (q.w - q.y)/(6.*d+e)), d/(q.x+e), q.x);
}
vec3 hsv2rgb(vec3 c){
  vec3 p = abs(fract(c.xxx + vec3(1., 2./3., 1./3.))*6. - 3.);
  return c.z * mix(vec3(1.), clamp(p-1., 0., 1.), c.y);
}
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  float a = hash(i), b = hash(i+vec2(1,0)), c = hash(i+vec2(0,1)), d = hash(i+vec2(1,1));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
vec3 blurAt(vec2 uv, float lod){
  vec2 ts = exp2(lod) / vec2(textureSize(uTex, 0)) * 0.8;
  return (textureLod(uTex, uv + vec2( ts.x, ts.y), lod).rgb + textureLod(uTex, uv + vec2(-ts.x, ts.y), lod).rgb
        + textureLod(uTex, uv + vec2( ts.x,-ts.y), lod).rgb + textureLod(uTex, uv + vec2(-ts.x,-ts.y), lod).rgb) * 0.25;
}
void main(){
  vec2 uv = 0.5 + (vUv - 0.5) / uZoom; if (uFlipX > 0.5) uv.x = 1. - uv.x;   // 數位變焦：只裁切取樣位置
  float asp = uRes.x / uRes.y;
  vec2 dq = (vUv - .5) * vec2(asp, 1.);
  float r = length(dq) / length(vec2(0.5 * asp, 0.5));        // 0 = 中心，1 = 四角

  vec3 src = texture(uTex, uv).rgb;
  vec3 bSmall = blurAt(uv, uLodSoft), bMid = blurAt(uv, uLodMid);

  // 1. 鏡頭：越靠角落越糊（中心保持清楚）
  float ew = uEdge * smoothstep(0.25, 1.0, r);
  vec3 base = mix(src, bSmall, clamp(ew * 1.8, 0., 1.));
  base = mix(base, bMid, clamp(ew * 1.8 - 0.8, 0., 1.));

  vec3 lin = toLin(base);
  float soft = clamp(uSoft + uGrain * 0.25 * step(0.0, uGrain), 0., 1.);   // 顆粒越粗，細節越少
  lin = mix(lin, toLin(bSmall), soft * (1. - ew));
  float ex = exp2(uExposure);
  lin *= ex * uWB;

  // 2. 光學暗角：在光線進底片前就變暗（不是最後疊一層黑）
  lin *= 1. - uVignette * smoothstep(0.15, 1.15, r);

  // 3. 光暈：Halation（紅橘色、貼著強光）＋ 柔光（亮處往外擴散）
  if (uHalation > 0. || uBloom > 0.) {
    vec3 b1 = toLin(blurAt(uv, uLodHal)) * ex * uWB;
    vec3 b2 = toLin(blurAt(uv, uLodHal + 1.5)) * ex * uWB;
    vec3 b = (b1 + b2) * 0.5;
    lin += uHalation * smoothstep(0.35, 1.0, luma(b)) * vec3(1.0, 0.32, 0.1) * 0.9;
    vec3 glow = b2 * smoothstep(0.12, 0.85, luma(b2));
    lin += uBloom * glow * 0.75;
    lin = mix(lin, max(lin, b), clamp(uBloom * 0.4, 0., 1.));
  }

  // 4. 漏光：從某一側進來，形狀帶雜訊、每張位置不同
  if (uLeak > 0.) {
    vec2 dir = vec2(cos(uLeakA), sin(uLeakA));
    vec2 q = vUv - .5;
    float edgeD = max(0., 0.5 - dot(q, dir));
    float across = dot(q, vec2(-dir.y, dir.x));
    float n = vnoise(vec2(across * 5. + uFxSeed, edgeD * 4. + uFxSeed * 0.37));
    float lk = exp(-edgeD / (0.06 + 0.13 * n)) * exp(-pow(across - uLeakP, 2.) / (0.025 + 0.06 * n));
    vec3 lc = mix(vec3(1.0, 0.16, 0.03), vec3(1.0, 0.75, 0.38), smoothstep(0.35, 0.95, lk));
    lin += uLeak * lk * lc * 2.2;
  }

  vec3 c = toGam(lin);
  float knee = 1. - 0.45 * uShoulder;
  vec3 rolled = knee + (1. - knee) * tanh((c - knee) / (1. - knee));
  c = mix(c, rolled, step(vec3(knee), c));
  c = clamp(c, 0., 1.);
  // 5. 對比：RGB 三層各自的 S 曲線（顏色會隨亮度改變）
  c = clamp(mix(c, c*c*(3.-2.*c), vec3(uContrast) + uChan), 0., 1.);

  // 6. 立體：局部對比（中半徑）＋ 邊緣效應（小半徑），只動亮度
  if (uClarity != 0.) {
    // 細紋理加強，但強烈明暗邊緣要收斂，否則會出現數位感的白邊光圈
    float lb = luma(base);
    float lm = luma(mix(bMid, blurAt(uv, uLodMid + 0.7), 0.5));
    float dm = lb - lm, ds = lb - luma(bSmall);
    dm = dm / (1. + abs(dm) * 9.);
    ds = ds / (1. + abs(ds) * 6.);
    float k = uClarity * (1.6 * dm + 0.9 * ds) * (0.35 + c.g * 0.65 * (1. - c.g) * 4. * 0.65);
    c = clamp(c + k, 0., 1.);
  }

  vec3 hsv = rgb2hsv(c);
  float sw = smoothstep(0.04, 0.3, hsv.y);
  vec3 adj = vec3(0.);
  for (int i = 0; i < 8; i++) {
    float a = HC[i], b = HC[i + 1];
    if (hsv.x >= a && hsv.x < b) adj = mix(uHSL[i], uHSL[(i + 1) % 8], (hsv.x - a) / (b - a));
  }
  adj *= sw;
  hsv.x = fract(hsv.x + adj.x);
  hsv.y = clamp(hsv.y * max(0., 1. + adj.y), 0., 1.);
  hsv.z *= 1. + adj.z;
  c = hsv2rgb(hsv);

  float L = luma(c);
  c = mix(vec3(L), c, uSat);
  float sat = max(max(c.r, c.g), c.b) - min(min(c.r, c.g), c.b);
  c *= 1. - uChrome * sat * sat * 0.45;
  L = luma(c);
  c += (uShadowTint * (1.-L)*(1.-L) + uHighTint * L*L) * 1.6;
  c = mix(c, vec3(dot(c, vec3(.3, .59, .11))), uMono);

  // 7. 黑位與白位：壓黑（crush）或褪色（fade），白色上限
  c = clamp((c - uCrush) / (1. - uCrush), 0., 1.);
  c = mix(vec3(uFade), vec3(uWhite), c);

  // 8. 顆粒：暗部多、高光少；強度在畫面上成團不均；大小兩層；RGB 各自不同
  vec2 gp = vUv * uRes / uGrainCell + uSeed * vec2(17.13, 41.7);
  float clump = 0.4 + 1.2 * vnoise(gp * 0.085 + uSeed * 3.1);
  float g = (vnoise(gp) * 0.6 + vnoise(gp * 1.93 + 5.3) * 0.4) - 0.5;
  g += (vnoise(gp * 0.45 + 9.7) - 0.5) * 0.55;
  vec3 gch = (vec3(vnoise(gp + 11.1), vnoise(gp + 23.7), vnoise(gp + 37.3)) - 0.5) * vec3(0.45, 0.38, 0.25) * (1. - uMono);
  L = luma(c);
  float tone = mix(1.3, 0.22, smoothstep(0.06, 0.95, L)) * smoothstep(0.0, 0.07, L + 0.02);
  c += (vec3(g) + gch) * uGrain * 0.22 * clump * tone;
  c = clamp(c, 0., 1.);
  o = vec4(mix(src, c, uStrength), 1.);
}`;

class FilmRenderer {
  constructor(canvas, preserve) {
    this.canvas = canvas;
    const gl = canvas.getContext('webgl2', { premultipliedAlpha: false, preserveDrawingBuffer: !!preserve, antialias: false });
    if (!gl) throw new Error('NO_WEBGL2');
    this.gl = gl;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    this.prog = prog; gl.useProgram(prog);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'aPos'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    this.tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, this.tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    this.u = {};
    const n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(prog, i); this.u[info.name] = gl.getUniformLocation(prog, info.name); }
    this.maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    this.srcW = 0; this.srcH = 0;
  }
  setSource(src, w, h) {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
    gl.generateMipmap(gl.TEXTURE_2D);
    this.srcW = w; this.srcH = h;
  }
  render(p, w, h, opt) {
    const gl = this.gl, u = this.u;
    if (this.canvas.width !== w) this.canvas.width = w;
    if (this.canvas.height !== h) this.canvas.height = h;
    gl.viewport(0, 0, w, h);
    gl.useProgram(this.prog);
    const zoom = Math.max(1, opt.zoom || 1);
    const maxDim = (Math.max(this.srcW, this.srcH) || 1) / zoom;
    const t = p.temp, tint = p.tint;
    gl.uniform1i(u.uTex, 0);
    gl.uniform2f(u.uRes, w, h);
    gl.uniform1f(u.uSeed, opt.seed || 0);
    gl.uniform1f(u.uExposure, p.exposure);
    gl.uniform3f(u.uWB, 1 + 0.12 * t, 1 - 0.04 * tint, 1 - 0.12 * t);
    gl.uniform1f(u.uSat, p.sat); gl.uniform1f(u.uFade, p.fade); gl.uniform1f(u.uWhite, p.white);
    gl.uniform1f(u.uContrast, p.contrast); gl.uniform1f(u.uShoulder, p.shoulder);
    gl.uniform3fv(u.uShadowTint, p.shadowTint); gl.uniform3fv(u.uHighTint, p.highTint);
    gl.uniform3fv(u['uHSL[0]'], new Float32Array(BANDS.flatMap(b => p.hsl[b])));
    gl.uniform1f(u.uChrome, p.chrome); gl.uniform1f(u.uGrain, p.grain);
    gl.uniform1f(u.uGrainCell, Math.max(1, p.grainSize * Math.min(w, h) / 1100));
    gl.uniform1f(u.uHalation, p.halation); gl.uniform1f(u.uBloom, p.bloom);
    gl.uniform1f(u.uVignette, p.vignette); gl.uniform1f(u.uMono, p.mono); gl.uniform1f(u.uSoft, p.soft);
    gl.uniform1f(u.uStrength, opt.strength == null ? 1 : opt.strength);
    gl.uniform1f(u.uLodHal, Math.log2(Math.max(1, 0.006 * maxDim)));
    gl.uniform1f(u.uLodSoft, Math.log2(Math.max(1, 0.0012 * maxDim)));
    gl.uniform1f(u.uFlipX, opt.flipX ? 1 : 0); gl.uniform1f(u.uZoom, zoom);
    gl.uniform1f(u.uCrush, p.crush); gl.uniform3fv(u.uChan, p.chan);
    gl.uniform1f(u.uClarity, p.clarity); gl.uniform1f(u.uEdge, p.edge);
    const fx = opt.fx || { a: 0, p: 0, s: 0 };
    gl.uniform1f(u.uLeak, p.leak); gl.uniform1f(u.uLeakA, fx.a); gl.uniform1f(u.uLeakP, fx.p); gl.uniform1f(u.uFxSeed, fx.s);
    gl.uniform1f(u.uLodMid, Math.log2(Math.max(1, 0.01 * maxDim)));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
}

/* ---------------- App 狀態 ---------------- */
const $ = id => document.getElementById(id);
const els = { preview: $('preview'), stage: $('stage'), vf: $('viewfinder'), hint: $('hint'), stamp: $('stamp'),
  looks: $('looks'), shutter: $('shutter'), thumb: $('thumb'), flip: $('flip') };

const store = { get(k, d) { try { const v = localStorage.getItem('filmcam.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem('filmcam.' + k, JSON.stringify(v)); } catch (e) {} } };

const state = {
  mode: 'none',           // 'camera' | 'edit' | 'none'
  lookIdx: Math.max(0, lookIndex(store.get('lookId', 'portra'))),
  scene: Object.assign({ subject: null, light: null, things: [] }, store.get('scene', {})),
  sceneTweak: store.get('sceneTweak', true),
  fx: null,
  user: Object.assign({}, USER_DEFAULT, store.get('user', {})),
  facing: 'environment',
  stream: null, video: null, editBitmap: null, editBlob: null,
  shots: [], busy: false, seed: 1, cameraError: null,
  folder: store.get('folder', 'all'),
  favs: new Set(store.get('favs', [])),
  recipes: store.get('recipes', []),
  recipeId: store.get('recipeId', null),
  userBeforeRecipe: store.get('userBeforeRecipe', null),
  adjTool: store.get('adjTool', 'exposure'),
  zoom: 1, hwZoom: null,           // 相機變焦：有硬體變焦就用硬體，沒有就數位裁切
  view: { s: 1, x: 0, y: 0 },       // 編輯時的放大檢視（只影響預覽）
  compare: false
};
if (state.recipeId && !state.recipes.some(r => r.id === state.recipeId)) state.recipeId = null;

let renderer;
try { renderer = new FilmRenderer(els.preview, false); }
catch (e) { showHint('這個瀏覽器不支援 WebGL2，沒辦法套用濾鏡。<br>請用新版的 Chrome 或 Safari 開啟。'); throw e; }

function effectiveParams() {
  const base = LOOKS[state.lookIdx].p, u = state.user;
  const p = Object.assign({}, base, { hsl: Object.assign({}, base.hsl) });
  if (state.sceneTweak) applyTweak(p, recommend(state.scene).tweak);
  p.exposure += u.exposure; p.temp += u.temp; p.tint += u.tint;
  p.grain *= u.grain / 100; p.halation *= u.halation / 100;
  p.vignette = Math.min(1, p.vignette + u.vignette / 100);
  p.bloom += u.bloom / 100; p.clarity += u.clarity / 100; p.edge = Math.min(1, p.edge + u.edge / 100);
  if (u.black > 0) p.fade += u.black / 100 * 0.22; else p.crush += -u.black / 100 * 0.12;
  p.white -= u.white / 100 * 0.3;
  p.leak += u.leak / 100; p.dust += u.dust / 100;
  return p;
}

/* ---------------- 版面 ---------------- */
function srcSize() {
  if (state.mode === 'camera' && state.video && state.video.videoWidth) return [state.video.videoWidth, state.video.videoHeight];
  if (state.mode === 'edit' && state.editBitmap) return [state.editBitmap.width, state.editBitmap.height];
  return [3, 4];
}
function layout() {
  const [sw, sh] = srcSize();
  const box = els.vf.getBoundingClientRect();
  const pad = 12, bw = box.width - pad * 2, bh = box.height - pad * 2;
  const s = Math.min(bw / sw, bh / sh);
  const cw = Math.round(sw * s), ch = Math.round(sh * s);
  els.stage.style.width = cw + 'px'; els.stage.style.height = ch + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  // 編輯時放大檢視 → 預覽畫布解析度跟著提高，才看得清細節
  const zr = state.mode === 'edit' ? Math.min(state.view.s, 3) : 1;
  let pw = Math.round(cw * dpr * zr), ph = Math.round(ch * dpr * zr);
  const cap = (zr > 1 ? 2400 : 1400) / Math.max(pw, ph); if (cap < 1) { pw = Math.round(pw * cap); ph = Math.round(ph * cap); }
  state.pw = pw; state.ph = ph;
  els.stamp.style.fontSize = Math.max(10, ch * 0.038) + 'px';
  if (state.mode === 'edit') setView(state.view.s, state.view.x, state.view.y); else setView(1, 0, 0);
  if (state.fx) drawFxOverlay();
}
window.addEventListener('resize', () => { layout(); requestRender(); });

function stampText(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return `'${p(d.getFullYear() % 100)} ${p(d.getMonth() + 1)} ${p(d.getDate())}`;
}
function updateStamp() {
  els.stamp.style.display = state.user.stamp && state.mode !== 'none' ? 'block' : 'none';
  els.stamp.textContent = stampText();
}

/* ---------------- 渲染迴圈 ---------------- */
let renderQueued = false;
function requestRender() { if (!renderQueued) { renderQueued = true; requestAnimationFrame(frame); } }
function frame() {
  renderQueued = false;
  const p = effectiveParams(), strength = state.compare ? 0 : state.user.strength / 100;
  if (state.mode === 'camera') {
    const v = state.video;
    if (v && v.readyState >= 2 && v.videoWidth) {
      if (!state.pw || state.lastVW !== v.videoWidth) { state.lastVW = v.videoWidth; layout(); }
      renderer.setSource(v, v.videoWidth, v.videoHeight);
      state.seed = (state.seed + 1) % 97;
      renderer.render(p, state.pw, state.ph, { seed: state.seed, strength, flipX: state.facing === 'user', fx: state.fx, zoom: digitalZoom() });
    }
    requestRender();
  } else if (state.mode === 'edit' && state.editPreview) {
    renderer.render(p, state.pw, state.ph, { seed: 3, strength, fx: state.fx });
  }
}

/* ---------------- 相機 ---------------- */
async function startCamera() {
  stopCamera();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('NO_GUM');
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: state.facing, width: { ideal: 2560 }, height: { ideal: 1920 } }, audio: false });
  const v = state.video || document.createElement('video');
  v.setAttribute('playsinline', ''); v.muted = true; v.srcObject = stream;
  await v.play();
  state.video = v; state.stream = stream; state.mode = 'camera'; state.lastVW = 0;
  setupZoom();
  hideHint(); setShutterLabel(); updateStamp(); updateSceneBar(); layout(); requestRender();
}
function stopCamera() {
  if (state.stream) state.stream.getTracks().forEach(t => t.stop());
  state.stream = null;
}
async function grabFullRes() {
  const track = state.stream && state.stream.getVideoTracks()[0];
  if (track && 'ImageCapture' in window) {
    try {
      const ic = new ImageCapture(track);
      // 部分裝置的 takePhoto 會卡住，超過 4 秒就改用預覽畫面截圖
      const blob = await Promise.race([ic.takePhoto(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000))]);
      return await decodeImage(blob);
    } catch (e) { /* 改用畫面截取 */ }
  }
  return await createImageBitmap(state.video);
}

/* ---------------- 匯入 / 編輯模式 ---------------- */
async function decodeImage(blob) {
  try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); }
  catch (e) {
    const url = URL.createObjectURL(blob);
    try { const img = new Image(); img.src = url; await img.decode(); return img; } finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
  }
}
async function openImage(file) {
  if (!file) return;
  try {
    const bmp = await decodeImage(file);
    stopCamera();
    state.editBitmap = bmp; state.mode = 'edit'; state.view = { s: 1, x: 0, y: 0 };
    layout();
    // 預覽用縮小版（放大檢視時最多 2400px）
    const k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    const pc = document.createElement('canvas'); pc.width = Math.round(bmp.width * k); pc.height = Math.round(bmp.height * k);
    pc.getContext('2d').drawImage(bmp, 0, 0, pc.width, pc.height);
    renderer.setSource(pc, pc.width, pc.height);
    state.editPreview = true;
    if (!document.body.classList.contains('scene-open')) openScenePanel();
    if (sceneSummary()) toast('沿用上一張的場景，不同的話請改選'); else showTips();
    hideHint(); setShutterLabel(); updateStamp(); requestRender();
  } catch (e) { toast('讀不到這張照片'); }
}

/* ---------------- 輸出全解析度 ---------------- */
let exportRenderer = null;
async function exportImage(bmp, flipX, zoom = 1) {
  if (!exportRenderer) exportRenderer = new FilmRenderer(document.createElement('canvas'), true);
  const limit = Math.min(exportRenderer.maxTex, 4096);
  // 數位變焦：從中間裁切
  const cw0 = bmp.width / zoom, ch0 = bmp.height / zoom, sx = (bmp.width - cw0) / 2, sy = (bmp.height - ch0) / 2;
  let w = cw0, h = ch0;
  const k = Math.min(1, limit / Math.max(w, h));
  w = Math.round(w * k); h = Math.round(h * k);
  // 一律先畫到 canvas：ImageBitmap 上傳時會忽略 UNPACK_FLIP_Y，直接用會上下顛倒
  const src = document.createElement('canvas'); src.width = w; src.height = h;
  src.getContext('2d').drawImage(bmp, sx, sy, cw0, ch0, 0, 0, w, h);
  exportRenderer.setSource(src, w, h);
  const ep = effectiveParams();
  exportRenderer.render(ep, w, h, { seed: Math.random() * 90, strength: state.user.strength / 100, flipX, fx: state.fx });
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const ctx = out.getContext('2d');
  ctx.drawImage(exportRenderer.canvas, 0, 0);
  drawDust(ctx, w, h, ep.dust * (state.user.strength / 100), state.fx.seed);
  if (state.user.stamp) {
    const fs = Math.round(h * 0.038);
    ctx.font = `700 ${fs}px "Courier New", ui-monospace, monospace`;
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    const txt = stampText().split('').join(String.fromCharCode(8202));
    ctx.shadowColor = 'rgba(255,90,0,0.8)'; ctx.shadowBlur = fs * 0.5; ctx.fillStyle = '#ff9a3c';
    ctx.fillText(txt, w * 0.95, h * 0.955);
    ctx.shadowBlur = fs * 0.15; ctx.fillText(txt, w * 0.95, h * 0.955);
  }
  return await new Promise(r => out.toBlob(r, 'image/jpeg', 0.92));
}

async function shoot() {
  if (state.busy) return;
  if (state.mode === 'none') { $('captureInput').click(); return; }
  state.busy = true; els.shutter.classList.add('busy');
  try {
    let bmp, flip = false;
    if (state.mode === 'camera') {
      const f = $('flash'); f.style.transition = 'none'; f.style.opacity = '0.7';
      requestAnimationFrame(() => { f.style.transition = 'opacity .3s'; f.style.opacity = '0'; });
      bmp = await grabFullRes(); flip = state.facing === 'user';
    } else bmp = state.editBitmap;
    const blob = await exportImage(bmp, flip, state.mode === 'camera' ? digitalZoom() : 1);
    const shot = { blob, url: URL.createObjectURL(blob), name: `film_${Date.now()}.jpg` };
    state.shots.unshift(shot);

}

const swatchCache = {};

async function buildSwatches() {
  const c = document.createElement('canvas'); c.width = 96; c.height = 96;
  const x = c.getContext('2d');
  const g1 = x.createLinearGradient(0, 0, 0, 60); g1.addColorStop(0, '#7fb2e5'); g1.addColorStop(1, '#d9e8f2');
  x.fillStyle = g1; x.fillRect(0, 0, 96, 60);
  x.fillStyle = '#f6c47a'; x.beginPath(); x.arc(70, 22, 10, 0, 7); x.fill();
  x.fillStyle = '#4f8a3c'; x.fillRect(0, 56, 96, 40);
  x.fillStyle = '#2f6a2a'; x.beginPath(); x.moveTo(0, 60); x.lineTo(30, 40); x.lineTo(60, 62); x.fill();
  x.fillStyle = '#e0a07c'; x.beginPath(); x.arc(34, 70, 12, 0, 7); x.fill();
  x.fillStyle = '#c0392b'; x.fillRect(22, 82, 24, 14);
  const r = new FilmRenderer(document.createElement('canvas'), true);

/* Android 返回鍵／手勢：先關掉面板，而不是直接離開 App */
// history.back() 是非同步的：還在等返回時要開新面板，就等返回完成再 pushState，避免一次退太多層
let histDepth = 0, histIgnore = 0, histPending = 0;
const pushEntry = () => { try { history.pushState({ filmcam: 1 }, ''); } catch (e) {} };
function pushPanel() { histDepth++; if (histIgnore > 0) histPending++; else pushEntry(); }
function popPanel() {
  if (histDepth <= 0) return;
  histDepth--;
  if (histPending > 0) { histPending--; return; }
  histIgnore++; history.back();
}
window.addEventListener('popstate', () => {
  if (histIgnore > 0) { histIgnore--; if (!histIgnore) while (histPending > 0) { histPending--; pushEntry(); } return; }
  if (histDepth <= 0) return;
  histDepth--;
  if ($('viewer').classList.contains('open')) $('viewer').classList.remove('open');
  else if (document.querySelector('.sheet.open')) closeSheets(true);
  else if (document.body.classList.contains('settings-open')) closeAdjust(false, true);
  else if (document.body.classList.contains('scene-open')) closeScenePanel(true);
});

/* ---------------- 取景器手勢 ----------------
   一指左右滑：換風格（放大檢視時改成拖曳）
   長按：看原圖，放開回來
   雙指：相機 = 變焦；編輯 = 放大檢視（不影響存檔）
   點兩下：回到 1×                                         */
const G = { pts: new Map(), mode: null, lastTap: 0 };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y), mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
function setCompare(on) {
  if (state.compare === on) return;
  state.compare = on; document.body.classList.toggle('compare', on);
  if (on) vibrate(8);
  requestRender();
}
els.vf.addEventListener('pointerdown', e => {
  if (e.target.closest('#hint, #zoomChips, #strengthPop') || state.mode === 'none') return;
  try { els.vf.setPointerCapture(e.pointerId); } catch (_) {}
  G.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (G.pts.size === 1) {
    G.mode = 'one'; G.start = { x: e.clientX, y: e.clientY }; G.t0 = e.timeStamp; G.moved = false; G.view0 = Object.assign({}, state.view);
    clearTimeout(G.lp);
    G.lp = setTimeout(() => { if (G.mode === 'one' && !G.moved) { G.mode = 'compare'; setCompare(true); } }, 260);
  } else if (G.pts.size === 2) {
    clearTimeout(G.lp); setCompare(false);
    const [a, b] = [...G.pts.values()];
    G.mode = 'pinch'; G.d0 = Math.max(10, dist(a, b)); G.mid0 = mid(a, b); G.z0 = state.zoom; G.view0 = Object.assign({}, state.view);
  }
});
els.vf.addEventListener('pointermove', e => {
  if (!G.pts.has(e.pointerId)) return;
  G.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (G.mode === 'one') {
    const dx = e.clientX - G.start.x, dy = e.clientY - G.start.y;
    if (!G.moved && Math.hypot(dx, dy) > 10) { G.moved = true; clearTimeout(G.lp); }
    if (G.moved && state.mode === 'edit' && G.view0.s > 1.01) setView(G.view0.s, G.view0.x + dx, G.view0.y + dy);
  } else if (G.mode === 'pinch' && G.pts.size >= 2) {
    const [a, b] = [...G.pts.values()], k = dist(a, b) / G.d0;
    if (state.mode === 'camera') setZoom(G.z0 * k);
    else zoomView(G.view0, k, G.mid0, mid(a, b));
  }
});
function vfUp(e) {
  if (!G.pts.has(e.pointerId)) return;
  G.pts.delete(e.pointerId);
  clearTimeout(G.lp);
  if (G.mode === 'compare') { setCompare(false); G.mode = 'done'; }
  else if (G.mode === 'one') {
    const dx = e.clientX - G.start.x, dy = e.clientY - G.start.y, dt = e.timeStamp - G.t0;   // 用事件時間，手機忙的時候也判斷得準
    const panning = state.mode === 'edit' && G.view0.s > 1.01;
    if (!G.moved && dt < 260) onVfTap(e.timeStamp);
    else if (!panning && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) stepLook(dx < 0 ? 1 : -1);
    G.mode = 'done';
  } else if (G.mode === 'pinch' && G.pts.size < 2) {
    G.mode = 'done';
    if (state.mode === 'edit') onViewZoomEnd();
  }
  if (G.pts.size === 0) G.mode = null;
}
els.vf.addEventListener('pointerup', vfUp);
els.vf.addEventListener('pointercancel', vfUp);
function onVfTap(now) {
  toggleStrengthPop(false);
  if (now - G.lastTap < 320) {           // 點兩下：回到 1×
    G.lastTap = 0;
    if (state.mode === 'edit' && state.view.s > 1.01) { setView(1, 0, 0); onViewZoomEnd(); }
    else if (state.mode === 'camera' && Math.abs(state.zoom - 1) > 0.01) setZoom(1);
  } else G.lastTap = now;
}
els.vf.addEventListener('wheel', e => {     // 電腦：滾輪／觸控板縮放
  if (state.mode === 'none') return;
  e.preventDefault();
  const k = Math.exp(-e.deltaY * 0.0025), p = { x: e.clientX, y: e.clientY };
  if (state.mode === 'camera') setZoom(state.zoom * k);
  else { zoomView(state.view, k, p, p); clearTimeout(G.wt); G.wt = setTimeout(onViewZoomEnd, 200); }
}, { passive: false });
els.vf.addEventListener('contextmenu', e => e.preventDefault());

/* 編輯時放大檢視（CSS 縮放預覽，放開後提高預覽解析度） */
function stageCenter() { const r = els.vf.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
function zoomView(v0, k, m0, m) {
  const C = stageCenter(), s = clamp(v0.s * k, 1, 6);
  const px = (m0.x - C.x - v0.x) / v0.s, py = (m0.y - C.y - v0.y) / v0.s;
  setView(s, m.x - C.x - s * px, m.y - C.y - s * py);
  showZoomTag(s);
}
function setView(s, x, y) {
  const w = els.stage.offsetWidth, h = els.stage.offsetHeight, mx = (s - 1) * w / 2, my = (s - 1) * h / 2;
  state.view = { s, x: clamp(x, -mx, mx), y: clamp(y, -my, my) };
  els.stage.style.transform = s <= 1.001 ? '' : `translate(${state.view.x}px,${state.view.y}px) scale(${s})`;
}
let vzTimer;
function onViewZoomEnd() { clearTimeout(vzTimer); vzTimer = setTimeout(() => { layout(); requestRender(); }, 60); }
let ztTimer;
function showZoomTag(z) {
  const t = $('zoomTag'); t.textContent = (Math.round(z * 10) / 10).toFixed(1) + '×'; t.classList.add('show');
  clearTimeout(ztTimer); ztTimer = setTimeout(() => t.classList.remove('show'), 700);
}

/* 相機變焦：手機支援就用硬體變焦（畫質好），否則從中間裁切（數位變焦） */
const digitalZoom = () => state.mode === 'camera' && !state.hwZoom ? state.zoom : 1;
function setupZoom() {
  state.hwZoom = null; state.zoom = 1;
  try {
    const tr = state.stream && state.stream.getVideoTracks()[0];
    const c = tr && tr.getCapabilities ? tr.getCapabilities() : {};
    if (c.zoom && c.zoom.max > c.zoom.min) {
      state.hwZoom = { min: c.zoom.min, max: Math.min(c.zoom.max, 10), track: tr };
      const cur = tr.getSettings().zoom;
      state.zoom = cur || Math.max(1, c.zoom.min);
      if (cur && Math.abs(cur - 1) > 0.01 && c.zoom.min <= 1) setZoom(1);
    }
  } catch (e) { state.hwZoom = null; }
  buildZoomChips();
}
const zoomRange = () => state.hwZoom ? [state.hwZoom.min, state.hwZoom.max] : [1, 4];
let hwBusy = false, hwWant = null;
async function pushHwZoom(z) {
  hwWant = z; if (hwBusy) return; hwBusy = true;
  while (hwWant != null) {
    const v = hwWant; hwWant = null;
    try { await state.hwZoom.track.applyConstraints({ advanced: [{ zoom: v }] }); }
    catch (e) { state.hwZoom = null; buildZoomChips(); requestRender(); break; }   // 不支援 → 改用數位變焦
  }
  hwBusy = false;
}
function setZoom(z) {
  const [lo, hi] = zoomRange(); z = clamp(z, lo, hi);
  if (Math.abs(z - state.zoom) < 1e-3) return;

  if (state.hwZoom) pushHwZoom(z);
  updateZoomChips(); showZoomTag(z); requestRender();
}
function buildZoomChips() {
  const [lo, hi] = zoomRange(), vals = [];
  if (lo < 0.95) vals.push(Math.round(lo * 10) / 10);
  vals.push(1, 2); if (hi >= 3) vals.push(3); if (hi >= 5) vals.push(5);
  const box = $('zoomChips'); box.innerHTML = '';
  for (const v of vals) {
    const b = document.createElement('button'); b.className = 'zchip'; b.dataset.v = v;
    b.onclick = () => { setZoom(v); vibrate(6); };
    box.appendChild(b);
  }
  updateZoomChips();
}
function updateZoomChips() {
  const chips = [...$('zoomChips').children];
  let act = chips[0];
  for (const c of chips) if (Number(c.dataset.v) <= state.zoom + 0.05) act = c;
  for (const c of chips) {
    const v = Number(c.dataset.v), on = c === act;
    c.classList.toggle('on', on);
    c.textContent = on ? (Math.abs(state.zoom - v) < 0.05 ? v + '×' : (Math.round(state.zoom * 10) / 10) + '×') : String(v);
  }
}

/* ---------------- 隨機材質：漏光位置、灰塵、毛髮、刮痕（每張不同） ---------------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const side = Math.floor(R() * 4);
  return { seed, a: side * Math.PI / 2 + (R() - 0.5) * 0.7, p: (R() - 0.5) * 0.6, s: R() * 50 };
}
function drawDust(ctx, w, h, amount, seed) {
  if (amount <= 0) return;
  const R = mulberry32(seed ^ 0x5bd1e995), k = Math.max(w, h) / 1000, amt = Math.min(1, amount);
  ctx.save();
  // 灰塵：底片上的灰塵掃描後多半是白點，大小不一；少數是黑點
  const n = Math.round(amt * 80);
  for (let i = 0; i < n; i++) {
    const x = R() * w, y = R() * h, rad = (0.7 + R() * R() * 3.2) * k, white = R() < 0.8;
    const a = (0.3 + R() * 0.6) * Math.min(1, amt * 1.4), col = white ? '255,250,240' : '25,18,12';
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad * 1.6);
    g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(0.55, `rgba(${col},${a * 0.6})`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad * 1.6, 0, 7); ctx.fill();
  }
  // 毛髮：細的彎曲線
  const hairs = Math.round(amt * (1 + R() * 4));
  for (let i = 0; i < hairs; i++) {
    const x = R() * w, y = R() * h, len = (40 + R() * 180) * k, ang = R() * Math.PI * 2, bend = (R() - 0.5) * 2.4;
    ctx.strokeStyle = `rgba(255,250,240,${0.3 + R() * 0.35})`; ctx.lineWidth = (0.6 + R() * 0.9) * k;
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + Math.cos(ang + bend) * len * 0.6, y + Math.sin(ang + bend) * len * 0.6, x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    ctx.stroke();
  }
  // 刮痕：細長、接近垂直（底片在相機裡被拖過）
  const sc = Math.round(amt * 3 * R());
  for (let i = 0; i < sc; i++) {
    const x = R() * w, y0 = R() * h * 0.3, y1 = h * (0.6 + R() * 0.4);
    ctx.strokeStyle = `rgba(255,255,255,${0.12 + R() * 0.2})`; ctx.lineWidth = (0.5 + R() * 0.8) * k;
    ctx.beginPath(); ctx.moveTo(x, y0);
    ctx.bezierCurveTo(x + (R() - 0.5) * 20 * k, y0 + (y1 - y0) / 3, x + (R() - 0.5) * 20 * k, y0 + 2 * (y1 - y0) / 3, x + (R() - 0.5) * 10 * k, y1);
    ctx.stroke();
  }
  ctx.restore();
}
function drawFxOverlay() {
  const c = $('fx'); if (!state.pw) return;
  c.width = state.pw; c.height = state.ph;
  const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height);
  if (state.mode !== 'none') drawDust(ctx, c.width, c.height, effectiveParams().dust, state.fx.seed);
}

$('importBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => { openImage(e.target.files[0]); e.target.value = ''; };
$('captureInput').onchange = e => { openImage(e.target.files[0]); e.target.value = ''; };
els.shutter.onclick = shoot;
els.flip.onclick = async () => {
  if (state.mode !== 'camera') { tryCamera(); return; }
  state.facing = state.facing === 'environment' ? 'user' : 'environment';
  try { await startCamera(); } catch (e) { toast('無法切換鏡頭'); }
};

function showHint(html) { els.hint.innerHTML = html; els.hint.style.display = 'grid'; }
function hideHint() { els.hint.style.display = 'none'; }
let toastTimer;
function toast(msg, ms = 2200) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', ms); }
function showTips() {   // 第一次使用：提示手勢
  if (store.get('tips6', false)) return;
  store.set('tips6', true);
  setTimeout(() => toast('左右滑換風格・長按看原圖・雙指縮放', 4500), 1600);
}

function noCameraHint(reason) {
  showHint(`<div><b>${reason}</b><br>還是可以用手機相機拍一張，或從相簿挑照片來套底片風格。
    <div class="row"><button class="pill primary" id="hintCapture">拍一張</button><button class="pill" id="hintImport">從相簿選</button></div>
    <div class="row"><button class="pill" id="hintRetry">再試一次開相機</button></div></div>`);
  $('hintCapture').onclick = () => $('captureInput').click();
  $('hintImport').onclick = () => $('fileInput').click();
  $('hintRetry').onclick = tryCamera;
}
async function tryCamera() {
  try { await startCamera(); showTips(); }
  catch (e) {
    state.mode = state.editBitmap ? 'edit' : 'none';
    const name = e && e.name;
    const reason = name === 'NotAllowedError' ? '相機權限被拒絕或這個環境不允許使用相機'
      : name === 'NotFoundError' ? '找不到相機' : '這個環境沒辦法開相機';
    if (state.mode === 'none') noCameraHint(reason); else toast(reason);
    setShutterLabel();
  }
}

/* ---------------- 啟動 ---------------- */
(async function init() {
  await buildSwatches().catch(() => {});
  state.fx = newFx();
  buildFolders(); buildLooks(); buildSceneGroups(); updateAdjDot(); updateSaveBtn(); layout(); setShutterLabel();
  markSelected();
  await tryCamera();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.mode === 'camera') stopCamera();
    else if (!document.hidden && state.mode === 'camera' && !state.stream) startCamera().catch(() => {});
  });
})();
</script>
